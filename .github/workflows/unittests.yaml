name: Unit Tests

on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      opensearch:
        image: opensearchproject/opensearch:2.13.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${{ secrets.OPENSEARCH_TEST_PASSWORD || 'TestPassword1!' }}
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -ksf -u admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-TestPassword1!} https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::0000000000000:role/****
          aws-region: ap-northeast-1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        env:
          ENV: CI
          OPENSEARCH_ENDPOINT: localhost
          OPENSEARCH_PORT: "9200"
          OPENSEARCH_PASS: ${{ secrets.OPENSEARCH_TEST_PASSWORD || 'TestPassword1!' }}
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${{ secrets.OPENSEARCH_TEST_PASSWORD || 'TestPassword1!' }}
        run: uv run pytest --disable-warnings -q --durations=10 -n auto --dist loadscope -m "not libreoffice and not ocr" tests/unittests/
